groups:
  - name: AgbaraVOIPAppAlerts
    rules:
      - alert: APIHighErrorRate
        expr: sum(rate(agbaravoip_http_requests_total{status_code=~"5.."}[5m])) by (job) / sum(rate(agbaravoip_http_requests_total[5m])) by (job) * 100 > 5
        for: 2m # Duration for which the condition must be true
        labels:
          severity: critical
        annotations:
          summary: "High API Error Rate on {{$labels.job}}"
          description: "More than 5% of requests to {{$labels.job}} are returning 5xx errors over the last 5 minutes."

      - alert: APILatencyHighP95
        expr: histogram_quantile(0.95, sum(rate(agbaravoip_http_request_duration_seconds_bucket[5m])) by (le, job, path)) > 0.5 # 500ms
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High P95 API Latency on {{$labels.job}} for path {{$labels.path}}"
          description: "P95 latency for path {{$labels.path}} on job {{$labels.job}} is above 0.5s for the last 5 minutes."

      - alert: AgbaraAppInstanceDown
        expr: up{job="agbaravoip_app"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "AgbaraVOIP Application Instance Down (job {{$labels.job}})"
          description: "Prometheus cannot scrape the AgbaraVOIP application instance {{$labels.instance}}."

      # Add more specific alerts as needed, e.g.:
      # - High CPU/Memory usage (requires node_exporter or cAdvisor metrics)
      # - Database specific alerts
      # - Freeswitch specific alerts
